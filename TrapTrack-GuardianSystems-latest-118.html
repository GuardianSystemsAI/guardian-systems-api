const { useState } = React;

const T = {
  bg: "#030a06", deep: "#020604", card: "#050f08", border: "#1a4a2a",
  text: "#c8f0d8", primary: "#00ff88", red: "#ff3333", blue: "#00cfff", amber: "#ffaa00",
};

const sc = (s) => s === "triggered" ? T.red : s === "active" ? T.primary : T.blue;

const TRAP_RANK = {
  "snap-mouse":1,"snap-rat":2,"cage-small":3,"door-small":4,"cage-medium":5,

  "cage-xl":"XL Cage","cage-large":"Large Cage","cage-medium":"Med Cage","cage-small":"Small Cage",

  "snap-rat":"Snap (Rat)","snap-mouse":"Snap (Mouse)","snare":"Snare","foothold":"Foothold","cage":"Cage"
};

function PawPrint({ fp, color, sz }) {
  const c = color || T.primary;
  const s = sz || 72;
  if (!fp) return <span style={{ fontSize: s * 0.5, display: "block", textAlign: "center" }}>🐾</span>;
  if (fp === "raccoon") return (
    <svg width={s} height={s} viewBox="0 0 90 100" fill={c} opacity="0.9">
      <ellipse cx="45" cy="75" rx="22" ry="16" />
      <ellipse cx="11" cy="44" rx="6" ry="13" transform="rotate(-22,11,44)" />
      <ellipse cx="27" cy="29" rx="6" ry="14" transform="rotate(-9,27,29)" />
      <ellipse cx="45" cy="24" rx="6" ry="14" />
      <ellipse cx="63" cy="29" rx="6" ry="14" transform="rotate(9,63,29)" />
      <ellipse cx="79" cy="44" rx="6" ry="13" transform="rotate(22,79,44)" />
    </svg>
  );
  if (fp === "opossum") return (
    <svg width={s} height={s} viewBox="0 0 90 100" fill={c} opacity="0.9">
      <ellipse cx="45" cy="72" rx="22" ry="16" />
      <ellipse cx="14" cy="44" rx="6" ry="11" transform="rotate(-28,14,44)" />
      <ellipse cx="30" cy="30" rx="6" ry="12" transform="rotate(-10,30,30)" />
      <ellipse cx="48" cy="26" rx="6" ry="12" transform="rotate(10,48,26)" />
      <ellipse cx="64" cy="32" rx="6" ry="11" transform="rotate(25,64,32)" />
      <ellipse cx="78" cy="60" rx="5" ry="8" transform="rotate(50,78,60)" />
    </svg>
  );
  if (fp === "mole") return (
    <svg width={s} height={s} viewBox="0 0 90 90" fill={c} opacity="0.9">
      <ellipse cx="45" cy="52" rx="26" ry="22" />
      {[0,45,90,135,180,225,270,315].map((deg, i) => {
        const a = deg * Math.PI / 180;
        const px = 45 + 36 * Math.cos(a);
        const py = 52 + 28 * Math.sin(a);
        return <ellipse key={i} cx={px} cy={py} rx="5" ry="9" transform={`rotate(${deg},${px},${py})`} />;
      })}
    </svg>
  );
  if (fp === "beaver") return (
    <svg width={s} height={s} viewBox="0 0 100 95" fill={c} opacity="0.9">
      <ellipse cx="50" cy="62" rx="32" ry="20" />
      {[[-30,38],[-13,27],[7,24],[27,27],[44,38]].map(([a, r], i) => {
        const rad = a * Math.PI / 180;
        const tx = 50 + r * Math.sin(rad);
        const ty = 62 - r * Math.cos(rad);
        return <ellipse key={i} cx={tx} cy={ty} rx="7" ry="11" transform={`rotate(${a},${tx},${ty})`} />;
      })}
      <path d="M22,44 Q38,54 50,28 Q62,54 78,44" fill="none" stroke={c} strokeWidth="2" opacity="0.5" />
    </svg>
  );
  if (fp === "bat") return (
    <svg width={s} height={s} viewBox="0 0 90 70" fill={c} opacity="0.9">
      <ellipse cx="45" cy="18" rx="12" ry="9" />
      <path d="M10,42 Q22,26 33,36 Q45,20 57,36 Q68,26 80,42" fill="none" stroke={c} strokeWidth="2.5" />
      <text x="45" y="60" textAnchor="middle" fontSize="8" fill={c} fontFamily="monospace">GUANO AT ENTRY</text>
    </svg>
  );
  const { toes = 4, claws = false, wide = false, elongated = false } = fp;
  const pRx = wide ? 24 : 18;
  const tRy = elongated ? 13 : 8;
  const spread = (wide ? 75 : toes === 5 ? 65 : 55) * Math.PI / 180;
  const els = [];
  for (let i = 0; i < toes; i++) {
    const a = -spread / 2 + (spread / (toes - 1)) * i;
    const tx = 45 + 31 * Math.sin(a);
    const ty = 75 - 40 - Math.abs(Math.cos(a)) * 4;
    const deg = a * 180 / Math.PI;
    els.push(<ellipse key={i} cx={tx} cy={ty} rx="5" ry={tRy} transform={`rotate(${deg},${tx},${ty})`} />);
    if (claws) els.push(<line key={"c"+i} x1={tx+Math.sin(a)*5} y1={ty-tRy-2} x2={tx+Math.sin(a)*9} y2={ty-tRy-9} stroke={c} strokeWidth="1.5" strokeLinecap="round" />);
  }
  return (
    <svg width={s} height={s} viewBox="0 0 90 95" fill={c} opacity="0.9">
      <ellipse cx="45" cy="75" rx={pRx} ry="15" />
      {els}
    </svg>
  );
}

function TrapIcon({ type, size }) {
  const sz = size || 46;
  const p = T.primary;
  const d = T.border;
  if (type === "snap-mouse" || type === "snap-rat") {
    const w = type === "snap-rat" ? 48 : 40;
    const x0 = (60 - w) / 2;
    return (
      <svg width={sz} height={sz} viewBox="0 0 60 60">
        <rect x={x0} y="36" width={w} height="10" rx="2" fill={p} opacity="0.3" />
        <rect x={x0} y="36" width={w} height="10" rx="2" fill="none" stroke={p} strokeWidth="1.5" />
        <path d={`M${x0+4},36 Q30,${type==="snap-rat"?14:18} ${x0+w-4},36`} fill="none" stroke={p} strokeWidth="2.5" />
        <circle cx="30" cy="35" r="3.5" fill={d} />
      </svg>
    );
  }
  if (type.startsWith("cage") || type === "cage") {
    const wMap = {"cage-small":36,"cage-medium":42,"cage-large":48,"cage-xl":54,"cage":44};
    const hMap = {"cage-small":20,"cage-medium":24,"cage-large":28,"cage-xl":30,"cage":24};
    const w = wMap[type] || 44;
    const h = hMap[type] || 24;
    const x0 = (60-w)/2, y0 = (60-h)/2;
    const bars = type==="cage-xl"?6:type==="cage-large"?5:4;
    return (
      <svg width={sz} height={sz} viewBox="0 0 60 60">
        <rect x={x0} y={y0} width={w} height={h} rx="2" fill="none" stroke={p} strokeWidth="2" />
        {Array.from({length:bars},(_,i)=>{
          const bx = x0+4+((w-8)/(bars-1))*i;
          return <line key={i} x1={bx} y1={y0} x2={bx} y2={y0+h} stroke={d} strokeWidth="1.5" />;
        })}
        <rect x="26" y={y0-6} width="8" height="8" rx="1" fill={d} />
      </svg>
    );
  }
  if (type.startsWith("door")) return (
    <svg width={sz} height={sz} viewBox="0 0 60 60">
      <path d="M14,52 L14,16 Q30,8 46,16 L46,52" fill="none" stroke={p} strokeWidth="2" />
      <line x1="14" y1="52" x2="46" y2="52" stroke={p} strokeWidth="2" />
      <ellipse cx="30" cy="32" rx="10" ry="14" fill="none" stroke={d} strokeWidth="1.5" />
    </svg>
  );
  if (type === "snare") return (
    <svg width={sz} height={sz} viewBox="0 0 60 60">
      <circle cx="30" cy="24" r="17" fill="none" stroke={p} strokeWidth="2.5" />
      <line x1="30" y1="41" x2="30" y2="55" stroke={p} strokeWidth="2" />
    </svg>
  );
  return (
    <svg width={sz} height={sz} viewBox="0 0 60 60">
      <path d="M8,40 Q18,20 30,36 Q42,20 52,40" fill="none" stroke={p} strokeWidth="3" />
      <circle cx="30" cy="36" r="5" fill={d} />
      <line x1="4" y1="40" x2="56" y2="40" stroke={p} strokeWidth="2.5" />
    </svg>
  );
}

      if (emailMode==="ai") { const notes = inspections.filter(i=>i.linkedTrapId===trap.id).map(i=>i.notes).join(" "); msg = await generateAIEmail(trap, notes).catch(()=>null); }
      if (!msg) msg = tmpl.replace("{name}",trap.customerName||"Customer").replace("{trap}",trap.name).replace("{location}",trap.address||trap.location||"your property");
      try {
        const r = await fetch("https://api.resend.com/emails",{method:"POST",mode:"cors",headers:{"Authorization":"Bearer "+rk,"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({from:rf,to:[trap.customerEmail],subject:"Guardian Systems - Follow-Up Reminder",text:msg+"\n\nGuardian Systems LLC\nSan Antonio, TX"})});
        if (r.ok||r.status===201) { results.sent.push(trap.customerName||trap.name); remindLog.current[trap.id]=today; }
        else { const e=await r.json().catch(()=>{}); results.failed.push((trap.customerName||trap.name)+" ("+(e&&e.message||r.status)+")"); }
      } catch(e) { const m=e.message.toLowerCase().includes("fetch")?"Use downloaded app for email":e.message; results.failed.push((trap.customerName||trap.name)+" ("+m+")"); }
    }
    if (emailMode==="ai") setAiComposing(false);
    setAutoSendStatus(results);
  };

  const sendConfirmEmail = async (useAI) => {
    if (!sendConfirmPopup) return;
    const rk = prefs.resendKey;
    const rf = prefs.resendFrom || "onboarding@resend.dev";
    if (!rk) { setAutoSendStatus({sent:[], failed:["Add Resend API key in Settings to send directly"]}); setSendConfirmPopup(null); return; }
    const trap = traps.find(t => t.customerEmail === sendConfirmPopup.email);
    let msg;
    if (useAI && prefs.anthropicKey && trap) {
      const notes = inspections.filter(i => i.linkedTrapId===trap.id || (i.client&&i.client.includes(trap.customerName||""))).map(i=>i.notes).join(" ");
      msg = await generateAIEmail(trap, notes).catch(()=>null);
    }
    if (!msg) {
      msg = "Hi "+(sendConfirmPopup.customerName||"there")+",\n\nYour Guardian Systems follow-up appointment is confirmed for "+sendConfirmPopup.date+".\n\nWe will be in touch to confirm your service visit. Thank you for choosing Guardian Systems!\n\nGuardian Systems LLC\nSan Antonio, TX";
    }
    try {
      const res = await fetch("https://api.resend.com/emails", {
        method:"POST",
        mode:"cors",
        headers:{"Authorization":"Bearer "+rk,"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({from:rf, to:[sendConfirmPopup.email], subject:"Guardian Systems - Appointment Confirmation "+sendConfirmPopup.date, text:msg})
      });
      if (res.ok||res.status===201) {
        setAutoSendStatus({sent:[sendConfirmPopup.customerName||sendConfirmPopup.email], failed:[]});
      } else {
        const errData = await res.json().catch(()=>({message:"HTTP "+res.status}));
        setAutoSendStatus({sent:[], failed:["Email failed: "+(errData.message||res.status)+". Check Resend key in Settings."]});
      }
    } catch(e) {
      const isSandbox = e.message.toLowerCase().includes("fetch") || e.message.toLowerCase().includes("network");
      const msg = isSandbox
        ? "Email sending requires the downloaded app. Text message still works."
        : "Send failed: "+e.message;
      setAutoSendStatus({sent:[], failed:[msg]});
    }
    setSendConfirmPopup(null);
  };

  const daysUntil = (d) => {
    const diff = Math.ceil((new Date(d) - new Date(today)) / 86400000);
    return diff === 0 ? "TODAY" : diff < 0 ? Math.abs(diff)+"d OVERDUE" : "in "+diff+"d";
  };
  const urgC = (d) => {
    const diff = Math.ceil((new Date(d) - new Date(today)) / 86400000);
    return diff <= 0 ? T.red : diff <= 3 ? T.amber : T.primary;
  };

  const saveTrap = () => {
    if (!trapForm.name.trim() || !trapForm.location.trim()) { alert("Name and location required"); return; }
    const d = trapForm.dateAdded || today;
    const nc = trapForm.nextCheck || addDays(3);
    const customerFields = { customerName:trapForm.customerName, customerPhone:trapForm.customerPhone, customerEmail:trapForm.customerEmail, customerAddress:trapForm.customerAddress };
    const syncPhone = trapForm.customerPhone ? trapForm.customerPhone.trim() : null;
    const syncCustomer = (list, skipId) => syncPhone
      ? list.map((t) => (t.id !== skipId && t.customerPhone && t.customerPhone.trim() === syncPhone) ? { ...t, ...customerFields } : t)
      : list;
    if (editId) {
      setTraps((p) => syncCustomer(p.map((t) => t.id === editId ? { ...trapForm, id:editId, lastChecked:d, nextCheck:nc } : t), editId));
    } else {
      const newId = Date.now();
      setTraps((p) => syncCustomer([...p, { ...trapForm, id:newId, lastChecked:d, nextCheck:nc }], newId));
    }
    setShowTrapModal(false); setEditId(null); setTrapForm(blankTrap);
  };

  const saveInsp = () => {
    if (!inspForm.location.trim()) return;
    const pts = inspForm.entryPoints.trim() ? inspForm.entryPoints.split(",").map((p) => p.trim()).filter(Boolean) : [];
    const fud = inspForm.followUpDate || addDays(7);
    setInspections((p) => [...p, { id:Date.now(), date:today, location:inspForm.location.trim(), client:inspForm.client.trim(), notes:inspForm.notes.trim(), entryPoints:pts, severity:inspForm.severity, followUpDate:fud, aiAnalysis:null }]);
    setShowInspModal(false); setInspForm(blankInsp);
  };

  const sortedTraps = [...traps].sort((a,b) => (TRAP_RANK[a.type]||99)-(TRAP_RANK[b.type]||99));

  const calDates = {};
  traps.forEach((t) => {
    if (t.lastChecked) { if (!calDates[t.lastChecked]) calDates[t.lastChecked]=[]; calDates[t.lastChecked].push({type:"trap",item:t}); }
    if (t.nextCheck)   { if (!calDates[t.nextCheck])   calDates[t.nextCheck]=[];   calDates[t.nextCheck].push({type:"check",item:t}); }
  });
  inspections.forEach((i) => {
    if (i.date)         { if (!calDates[i.date])         calDates[i.date]=[];         calDates[i.date].push({type:"insp",item:i}); }
    if (i.followUpDate) { if (!calDates[i.followUpDate]) calDates[i.followUpDate]=[]; calDates[i.followUpDate].push({type:"followup",item:i}); }

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  if (!isAuthenticated) {
    return (

          <div style={{ textAlign:"center", marginBottom:"20px" }}>
            <div style={{ fontSize:"26px", color:T.primary, fontWeight:"bold" }}>🎯 TRAPTRACK</div>
            <div style={{ fontSize:"11px", color:"#3a6a4a", fontWeight:"bold", marginTop:"4px" }}>GUARDIAN SECURITY GATEWAY</div>
          </div>
          <div style={{ marginBottom:"14px" }}>
            <label style={{ display:"block", color:T.primary, fontSize:"10px", fontWeight:"bold", marginBottom:"5px" }}>TECHNICIAN NAME / LICENSE</label>

          </div>
          <div style={{ marginBottom:"20px" }}>
            <label style={{ display:"block", color:T.primary, fontSize:"10px", fontWeight:"bold", marginBottom:"5px" }}>PASSWORD PIN</label>
            <input type="password" style={IS} placeholder="••••" value={loginPin} onChange={(e)=>setLoginPin(e.target.value)} required />
          </div>
          <button type="submit" style={{ width:"100%", padding:"14px", backgroundColor:T.primary, color:T.bg, border:"none", borderRadius:"8px", cursor:"pointer", fontSize:"14px", fontWeight:"bold" }}>
            AUTHORIZE SECURE SIGN IN →

        </form>

  return (
    <div style={{ backgroundColor:T.bg, color:T.text, minHeight:"100vh", fontFamily:"'Courier New',monospace", display:"flex", flexDirection:"column" }}>

        {activeTab === "dashboard" && (

              <div style={{ fontSize:"9px", color:"#3a6a4a", marginTop:"3px" }}>Guardian Systems LLC · License: GT-2025-001</div>
            </div>
            <div style={{ backgroundColor:T.card, border:"2px solid "+T.primary, borderRadius:"12px", padding:"16px", marginBottom:"16px" }}>
              <div style={{ fontSize:"10px", color:T.primary, fontWeight:"bold", marginBottom:"10px", letterSpacing:"1px" }}>OPERATION STATUS</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
                {[["TOTAL",traps.length,T.primary,"tot",null,"All traps in system"],["DEPLOYED",traps.filter((t)=>t.deployLocation==="deployed").length,T.amber,"dep","deployed","Traps currently in the field"],["ACTIVE",traps.filter((t)=>t.status==="active").length,T.primary,"act","active","Armed and waiting for catch"],["TRIGGERED",traps.filter((t)=>t.status==="triggered").length,T.red,"tri","triggered","Animal caught — needs service"]].map(([lbl,val,col,key,filter,desc]) => (

                <div style={{ fontSize:"10px", color:T.amber, fontWeight:"bold" }}>

                </div>
                <button onClick={()=>setInvFilter(null)} style={{ background:"none", border:"none", color:T.amber, cursor:"pointer", fontSize:"11px", fontWeight:"bold" }}>SHOW ALL ✕</button>
              </div>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", marginBottom:"12px" }}>
              {[["ON TRUCK",traps.filter((t)=>t.deployLocation==="truck").length,T.primary],["DEPLOYED",traps.filter((t)=>t.deployLocation==="deployed").length,T.amber],["STORAGE",traps.filter((t)=>t.deployLocation==="storage").length,T.blue]].map(([l,v,c]) => (
                <div key={l} style={{ backgroundColor:T.card, border:"2px solid "+c, borderRadius:"8px", padding:"10px", textAlign:"center" }}>
                  <div style={{ fontSize:"22px", color:c, fontWeight:"bold" }}>{v}</div>
                  <div style={{ fontSize:"8px", color:"#3a6a4a" }}>{l}</div>
                </div>
              ))}
            </div>
            <button onClick={()=>{setEditId(null);setTrapForm(blankTrap);setShowTrapModal(true);}} style={{ width:"100%", padding:"12px", backgroundColor:T.primary, color:T.bg, border:"none", borderRadius:"8px", cursor:"pointer", fontSize:"12px", fontWeight:"bold", marginBottom:"12px" }}>+ NEW TRAP</button>
            {(()=>{
              const filtered = invFilter==="deployed" ? sortedTraps.filter((t)=>t.deployLocation==="deployed")
                : invFilter==="active" ? sortedTraps.filter((t)=>t.status==="active")
                : invFilter==="triggered" ? sortedTraps.filter((t)=>t.status==="triggered")
                : sortedTraps;
              if (filtered.length===0) return <div style={{ textAlign:"center", padding:"30px", color:"#3a6a4a", fontSize:"11px" }}>No traps match this filter.</div>;
              return filtered.map((trap) => (
              <div key={trap.id} style={{ backgroundColor:T.card, border:"1px solid "+T.border, borderRadius:"10px", padding:"12px", marginBottom:"10px" }}>
                <div style={{ display:"flex", gap:"10px", alignItems:"flex-start", marginBottom:"8px" }}>
                  <div style={{ flexShrink:0, opacity:0.85 }}><TrapIcon type={trap.type} size={44} /></div>
                  <div style={{ flex:1, minWidth:0, cursor:"pointer" }} onClick={()=>setZoomModal({title:trap.name, items:[TRAP_LBL[trap.type]||trap.type, "📍 "+trap.location+(trap.trapLocation?" — "+trap.trapLocation:""), trap.address?"🏠 "+trap.address:null, trap.nextCheck?"📅 Next: "+trap.nextCheck+" ("+daysUntil(trap.nextCheck)+")":null, trap.customerName?"👤 "+trap.customerName:null, trap.customerPhone?"📞 "+trap.customerPhone:null].filter(Boolean)})}>
                    <div style={{ fontSize:"13px", color:T.text, fontWeight:"bold" }}>{trap.name}</div>
                    <div style={{ fontSize:"9px", color:"#3a6a4a" }}>{TRAP_LBL[trap.type]||trap.type}</div>
                    <div style={{ fontSize:"9px", color:"#3a6a4a" }}>📍 {trap.location}{trap.trapLocation?" — "+trap.trapLocation:""}</div>
                    {trap.address && <div style={{ fontSize:"9px", color:"#3a6a4a" }}>🏠 {trap.address}</div>}
                    {trap.nextCheck && <div style={{ fontSize:"9px", color:urgC(trap.nextCheck) }}>Next: {trap.nextCheck} ({daysUntil(trap.nextCheck)})</div>}
                  </div>
                  <div style={{ position:"relative", flexShrink:0 }}>
                    <button onClick={(e)=>{e.stopPropagation();setStatusPopupId(statusPopupId===trap.id?null:trap.id);}} style={{ backgroundColor:sc(trap.status)+"22", padding:"5px 8px", borderRadius:"5px", fontSize:"8px", color:sc(trap.status), fontWeight:"bold", border:"1px solid "+sc(trap.status), cursor:"pointer" }}>
                      {trap.status.toUpperCase()} ▾

                    {statusPopupId===trap.id && (
                      <div style={{ position:"absolute", right:0, top:"110%", backgroundColor:T.card, border:"1px solid "+T.primary, borderRadius:"8px", zIndex:500, minWidth:"130px", overflow:"hidden", boxShadow:"0 4px 20px rgba(0,0,0,0.8)" }} onClick={(e)=>e.stopPropagation()}>
                        {["active","triggered","checked","reset","removed"].map((st) => (
                          <button key={st} onClick={()=>{setTraps((p)=>p.map((t)=>t.id===trap.id?{...t,status:st}:t));setStatusPopupId(null);}} style={{ display:"block", width:"100%", padding:"9px 12px", backgroundColor:trap.status===st?sc(st)+"33":"transparent", border:"none", borderBottom:"1px solid "+T.border, color:sc(st), fontSize:"10px", fontWeight:"bold", cursor:"pointer", textAlign:"left" }}>
                            {st==="active"?"🟢":st==="triggered"?"🔴":st==="checked"?"🔵":st==="reset"?"🟡":"⚫"} {st.toUpperCase()}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
                <div style={{ fontSize:"9px", color:"#3a6a4a", marginBottom:"8px", padding:"4px 8px", backgroundColor:T.deep, borderRadius:"4px", display:"flex", gap:"8px", alignItems:"center" }}>
                  <span>{trap.deployLocation==="truck"?"🚐 ON TRUCK":trap.deployLocation==="deployed"?"🎯 DEPLOYED":"📦 STORAGE"}</span>
                  {trap.propertyType && <span style={{ color:T.blue+"99" }}>·</span>}
                  {trap.propertyType && <span>{trap.propertyType==="primary"?"🏠 Primary":trap.propertyType==="rental"?"🏘️ Rental":trap.propertyType==="commercial"?"🏢 Commercial":trap.propertyType==="vacation"?"🏖️ Vacation":"📍 Other"}</span>}
                </div>
                {trap.customerName && (
                  <button onClick={()=>setCustModal(trap.id)} style={{ display:"block", width:"100%", marginBottom:"8px", padding:"7px", backgroundColor:T.blue+"15", color:T.blue, border:"1px solid "+T.blue+"33", borderRadius:"6px", cursor:"pointer", fontSize:"9px", fontWeight:"bold", textAlign:"left" }}>
                    👤 {trap.customerName}{trap.customerPhone?" · "+trap.customerPhone:""}{trap.customerAddress?"\n🏠 "+trap.customerAddress:""}
                  </button>
                )}
                <div style={{ display:"flex", gap:"8px" }}>
                  <button onClick={()=>{setEditId(trap.id);setTrapForm({...trap});setShowTrapModal(true);}} style={{ flex:1, padding:"6px", backgroundColor:T.blue+"20", color:T.blue, border:"none", borderRadius:"4px", cursor:"pointer", fontSize:"9px", fontWeight:"bold" }}>EDIT</button>
                  <button onClick={()=>setTraps((p)=>p.filter((t)=>t.id!==trap.id))} style={{ flex:1, padding:"6px", backgroundColor:T.red+"20", color:T.red, border:"none", borderRadius:"4px", cursor:"pointer", fontSize:"9px", fontWeight:"bold" }}>DELETE</button>
                </div>
              </div>
            ));
            })()}
          </div>
        )}

        {activeTab === "calendar" && (
          <div style={{ padding:"16px" }}>
            <div style={{ marginBottom:"12px" }}>
              <div style={{ fontSize:"10px", color:"#3a6a4a", letterSpacing:"2px" }}>CALENDAR</div>
              <div style={{ fontSize:"20px", color:T.primary, fontWeight:"bold" }}>{MONTHS[calMonth.getMonth()]} {calMonth.getFullYear()}</div>
              <div style={{ display:"flex", gap:"10px", fontSize:"8px", color:"#3a6a4a", marginTop:"3px", flexWrap:"wrap" }}>
                <span style={{ color:T.primary }}>● Checked</span>
                <span style={{ color:T.amber }}>● Scheduled</span>
                <span style={{ color:T.blue }}>● Inspection</span>
                <span style={{ color:T.red }}>● Follow-up</span>
              </div>
            </div>
            <div style={{ backgroundColor:T.card, border:"1px solid "+T.border, borderRadius:"8px", padding:"12px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
                <button onClick={()=>setCalMonth((m)=>new Date(m.getFullYear(),m.getMonth()-1))} style={{ backgroundColor:"transparent", border:"1px solid "+T.border, color:T.primary, padding:"4px 10px", borderRadius:"4px", cursor:"pointer", fontSize:"10px", fontWeight:"bold" }}>← PREV</button>
                <div style={{ fontSize:"11px", color:T.text, fontWeight:"bold" }}>{MONTHS[calMonth.getMonth()]}</div>
                <button onClick={()=>setCalMonth((m)=>new Date(m.getFullYear(),m.getMonth()+1))} style={{ backgroundColor:"transparent", border:"1px solid "+T.border, color:T.primary, padding:"4px 10px", borderRadius:"4px", cursor:"pointer", fontSize:"10px", fontWeight:"bold" }}>NEXT →</button>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"3px", marginBottom:"4px" }}>
                {["S","M","T","W","T","F","S"].map((d,i) => <div key={i} style={{ textAlign:"center", fontSize:"8px", color:"#3a6a4a", fontWeight:"bold" }}>{d}</div>)}
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"3px" }}>
                {(()=>{
                  const y=calMonth.getFullYear(), m=calMonth.getMonth();
                  const days=[];
                  for (let i=0; i<new Date(y,m,1).getDay(); i++) days.push(null);
                  for (let i=1; i<=new Date(y,m+1,0).getDate(); i++) days.push(new Date(y,m,i));
                  return days.map((date,idx) => {
                    const ds = date&&date.toISOString().split("T")[0];
                    const items = (ds&&calDates[ds])||[];
                    const hasTrap    = items.some((x)=>x.type==="trap");
                    const hasCheck   = items.some((x)=>x.type==="check");
                    const hasInsp    = items.some((x)=>x.type==="insp");
                    const hasFollowup= items.some((x)=>x.type==="followup");
                    const hasAnything = items.length > 0;
                    const isToday = ds===today;
                    const isSel = date&&selDate&&date.toDateString()===selDate.toDateString();
                    return (
                      <button key={idx} onClick={()=>date&&setSelDate(date)} style={{ padding:"4px 1px", aspectRatio:"1", borderRadius:"4px", border:"1px solid "+(isSel?T.primary:isToday?T.blue:hasAnything?T.primary+"55":T.border), backgroundColor:isSel?T.primary+"33":isToday?T.blue+"11":hasAnything?T.primary+"08":T.deep, color:isSel?T.primary:isToday?T.blue:date?T.text:"#3a6a4a", fontSize:"9px", fontWeight:"600", cursor:date?"pointer":"default", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"1px" }}>

                            {hasFollowup && <div style={{ fontSize:"5px", color:T.red }}>●</div>}
                          </div>
                        </>}

              ].filter(Boolean);
              return (
                <div key={trap.id} onClick={()=>setZoomModal({title:"📋 "+trap.name, items:zoomItems})} style={{ backgroundColor:T.deep, borderRadius:"8px", padding:"12px", marginBottom:"10px", border:"1px solid "+T.amber+"33", cursor:"pointer" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"6px" }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:"12px", color:"#ffffff", fontWeight:"bold" }}>{trap.name} <span style={{ fontSize:"9px", color:T.primary+"88" }}>🔍 tap to zoom</span></div>
                      {trap.customerName ? <div style={{ fontSize:"11px", color:T.blue, marginTop:"2px" }}>👤 {trap.customerName}</div> : null}
                      {(trap.address||trap.location) ? <div onClick={e=>{e.stopPropagation();setActiveTab("map");setReminderQueue([]);}} style={{ fontSize:"9px", color:T.blue, marginTop:"2px", textDecoration:"underline", cursor:"pointer" }}>🗺️ {trap.address||trap.location}</div> : null}
                      {trap.caughtAnimal ? <div style={{ fontSize:"9px", color:T.amber, marginTop:"2px" }}>🐾 {trap.caughtAnimal}</div> : <div style={{ fontSize:"9px", color:"#a8d4b8", marginTop:"2px" }}>🎯 {TRAP_LBL[trap.type]||trap.type}</div>}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:"6px", flexWrap:"wrap" }}>
                    {phone ? <a href={"tel:"+phone} onClick={e=>e.stopPropagation()} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:"5px", padding:"9px 6px", backgroundColor:T.primary+"22", border:"1px solid "+T.primary+"44", borderRadius:"6px", color:T.primary, fontSize:"10px", fontWeight:"bold", textDecoration:"none", minWidth:"50px" }}>📞 Call</a> : null}
                    {phone ? <a href={"sms:"+phone+"?body="+smsMsg} onClick={e=>{e.stopPropagation();remindLog.current[trap.id]=today;setReminderQueue(q=>q.filter(t=>t.id!==trap.id));}} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:"5px", padding:"9px 6px", backgroundColor:T.blue+"22", border:"1px solid "+T.blue+"44", borderRadius:"6px", color:T.blue, fontSize:"10px", fontWeight:"bold", textDecoration:"none", minWidth:"50px" }}>📱 Text</a> : null}
                    {trap.customerEmail ? <a href={"mailto:"+trap.customerEmail} onClick={e=>e.stopPropagation()} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:"5px", padding:"9px 6px", backgroundColor:"#EA4335"+"22", border:"1px solid #EA433544", borderRadius:"6px", color:"#EA4335", fontSize:"10px", fontWeight:"bold", textDecoration:"none", minWidth:"50px" }}>✉️ Email</a> : null}
                    <button onClick={e=>{e.stopPropagation();remindLog.current[trap.id]=today;setReminderQueue(q=>q.filter(t=>t.id!==trap.id));}} style={{ flex:1, padding:"9px 6px", backgroundColor:T.deep, border:"1px solid "+T.border, borderRadius:"6px", color:"#a8d4b8", fontSize:"9px", fontWeight:"bold", cursor:"pointer", minWidth:"50px" }}>Skip</button>
                  </div>
                </div>
              );
            })}
            <button onClick={()=>sendAutoReminders(reminderQueue)} style={{ width:"100%", padding:"13px", backgroundColor:emailMode==="ai"?"#8b5cf6":T.primary, border:"none", color:T.bg, borderRadius:"8px", cursor:"pointer", fontSize:"12px", fontWeight:"bold", marginTop:"4px", marginBottom:"6px" }}>
              {emailMode==="ai"?"🤖 Send AI Emails":"📧 Send Reminders"} ({reminderQueue.filter(t=>t.customerEmail).length})
            </button>
            <button onClick={()=>setReminderQueue([])} style={{ width:"100%", padding:"11px", backgroundColor:T.deep, border:"1px solid "+T.border, color:"#a8d4b8", borderRadius:"8px", cursor:"pointer", fontSize:"11px", fontWeight:"bold" }}>Dismiss All</button>
          </div>
        </div>
      ) : null}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TrapTrack />);
  </script>
</body>
</html>
